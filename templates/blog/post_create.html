{% extends 'base.html' %}

{% block title %} New Post {% endblock %}

{% block content %}

<h1>Write a New Post</h1>

<form method="post" enctype="multipart/form-data">

    {% csrf_token %}

    {% for field in form %}
    
        <div>
            {{ field.label_tag }}<br>
            {{ field }}
            {% if field.help_text %}
                <small>{{ field.help_text }}</small>
            {% endif %}
        {{ field.errors }}
        </div>

        {% endfor %}

    <button type="submit">Create Post</button>

</form>

{% endblock %}
